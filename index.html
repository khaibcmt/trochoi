<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Đấu Trường 3D: Kéo Co, Rung Chuông Vàng & Ai Nhanh Nhất</title>
  <meta name="description" content="Hệ Thống 12 Môn THPT (GDPT 2018) – Đấu Trường 3D Kéo Co, Rung Chuông Vàng và Ai Nhanh Nhất đa nền tảng thời gian thực">
  <meta property="og:title" content="Đấu Trường 3D: Kéo Co, Rung Chuông Vàng & Ai Nhanh Nhất">
  <meta property="og:description" content="Hệ Thống 12 Môn THPT (GDPT 2018) – Đấu Trường 3D Kéo Co, Rung Chuông Vàng và Ai Nhanh Nhất đa nền tảng thời gian thực">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- ==================== CYBER GAMING 3D TEACHER AUTH MODAL ==================== -->
  <style>
    @keyframes dautruongPulseGlow {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.85)) drop-shadow(0 0 28px rgba(245, 158, 11, 0.55));
      }
      50% {
        transform: translateY(-4px) scale(1.06);
        filter: drop-shadow(0 0 22px rgba(250, 204, 21, 0.95)) drop-shadow(0 0 38px rgba(168, 85, 247, 0.75));
      }
    }

    @keyframes dautruongLedBlink {
      0%, 100% {
        opacity: 1;
        box-shadow: 0 0 10px #22c55e, 0 0 20px #22c55e;
      }
      50% {
        opacity: 0.35;
        box-shadow: 0 0 4px #22c55e;
      }
    }

    @keyframes dautruongBorderFlow {
      0% {
        border-color: rgba(56, 189, 248, 0.85);
        box-shadow: 0 0 30px rgba(56, 189, 248, 0.35), 0 20px 60px rgba(0, 0, 0, 0.85), inset 0 0 24px rgba(56, 189, 248, 0.15);
      }
      50% {
        border-color: rgba(168, 85, 247, 0.9);
        box-shadow: 0 0 35px rgba(168, 85, 247, 0.4), 0 20px 60px rgba(0, 0, 0, 0.85), inset 0 0 24px rgba(168, 85, 247, 0.15);
      }
      100% {
        border-color: rgba(56, 189, 248, 0.85);
        box-shadow: 0 0 30px rgba(56, 189, 248, 0.35), 0 20px 60px rgba(0, 0, 0, 0.85), inset 0 0 24px rgba(56, 189, 248, 0.15);
      }
    }

    #dautruong-auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background:
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.22), transparent 42%),
        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.24), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.88), rgba(2, 6, 23, 0.96));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      overflow-y: auto;
    }

    #dautruong-auth-overlay.active {
      display: flex;
    }

    .dt-cyber-card {
      position: relative;
      width: 100%;
      max-width: 470px;
      padding: 26px 24px 24px;
      border-radius: 26px;
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.92) 0%, rgba(9, 13, 28, 0.96) 55%, rgba(23, 15, 45, 0.94) 100%);
      border: 2px solid rgba(56, 189, 248, 0.85);
      animation: dautruongBorderFlow 5s infinite ease-in-out;
      color: #f8fafc;
      text-align: center;
      overflow: hidden;
    }

    .dt-cyber-card::before {
      content: "";
      position: absolute;
      top: -60%;
      left: -60%;
      width: 220%;
      height: 220%;
      background: radial-gradient(circle at center, rgba(56, 189, 248, 0.07) 0%, transparent 60%);
      pointer-events: none;
    }

    .dt-top-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25), inset 0 0 10px rgba(56, 189, 248, 0.15);
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #e0f2fe;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .dt-led-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      animation: dautruongLedBlink 1.2s infinite ease-in-out;
      flex-shrink: 0;
    }

    .dt-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px auto 10px;
    }

    .dt-logo-3d {
      width: 74px;
      height: 74px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      border: 2px solid rgba(250, 204, 21, 0.75);
      box-shadow:
        0 8px 0 #0f172a,
        0 0 24px rgba(250, 204, 21, 0.45),
        inset 0 2px 6px rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      animation: dautruongPulseGlow 2.6s infinite ease-in-out;
      user-select: none;
    }

    .dt-neon-title {
      margin: 4px 0 6px;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #38bdf8 0%, #c084fc 50%, #fde047 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(56, 189, 248, 0.35));
    }

    .dt-subtitle {
      margin: 0 0 18px;
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .dt-form-group {
      text-align: left;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.85);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .dt-form-group:focus-within {
      transform: translateY(-2px);
    }

    /* Khối 1: Neon Cyan */
    .dt-box-cyan {
      border: 2px solid #06b6d4;
      box-shadow: 0 5px 0 #083344, 0 0 16px rgba(6, 182, 212, 0.3), inset 0 0 12px rgba(6, 182, 212, 0.1);
    }
    .dt-box-cyan:focus-within {
      box-shadow: 0 6px 0 #083344, 0 0 24px rgba(34, 211, 238, 0.65), inset 0 0 14px rgba(34, 211, 238, 0.2);
    }

    /* Khối 2: Neon Purple */
    .dt-box-purple {
      border: 2px solid #a855f7;
      box-shadow: 0 5px 0 #3b0764, 0 0 16px rgba(168, 85, 247, 0.3), inset 0 0 12px rgba(168, 85, 247, 0.1);
    }
    .dt-box-purple:focus-within {
      box-shadow: 0 6px 0 #3b0764, 0 0 24px rgba(192, 132, 252, 0.65), inset 0 0 14px rgba(192, 132, 252, 0.2);
    }

    /* Khối 3: Neon Gold */
    .dt-box-gold {
      border: 2px solid #eab308;
      box-shadow: 0 5px 0 #422006, 0 0 16px rgba(234, 179, 8, 0.3), inset 0 0 12px rgba(234, 179, 8, 0.1);
    }
    .dt-box-gold:focus-within {
      box-shadow: 0 6px 0 #422006, 0 0 24px rgba(250, 204, 21, 0.65), inset 0 0 14px rgba(250, 204, 21, 0.2);
    }

    .dt-field-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .dt-box-cyan .dt-field-label { color: #67e8f9; }
    .dt-box-purple .dt-field-label { color: #d8b4fe; }
    .dt-box-gold .dt-field-label { color: #fde047; }

    .dt-input {
      width: 100%;
      box-sizing: border-box;
      border: none;
      outline: none;
      background: rgba(2, 6, 23, 0.75);
      color: #ffffff;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 800;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .dt-input::placeholder {
      color: #64748b;
      font-weight: 700;
    }

    .dt-input:focus {
      background: rgba(2, 6, 23, 0.95);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .dt-error-alert {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 10px 0 14px;
      padding: 11px 14px;
      border-radius: 12px;
      background: rgba(127, 29, 29, 0.88);
      border: 2px solid #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.55), inset 0 0 10px rgba(239, 68, 68, 0.25);
      color: #fecaca;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.4;
      text-align: left;
    }

    .dt-error-alert.show {
      display: flex;
    }

    .dt-btn-start-3d {
      width: 100%;
      margin-top: 6px;
      padding: 14px 20px;
      border-radius: 16px;
      border: 2px solid #fde047;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 45%, #7c3aed 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 6px 0 #1e3a8a,
        0 10px 25px rgba(37, 99, 235, 0.55),
        inset 0 2px 4px rgba(255, 255, 255, 0.4);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .dt-btn-start-3d:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow:
        0 8px 0 #1e3a8a,
        0 14px 30px rgba(56, 189, 248, 0.7),
        inset 0 2px 6px rgba(255, 255, 255, 0.5);
    }

    .dt-btn-start-3d:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 #1e3a8a,
        0 5px 15px rgba(37, 99, 235, 0.4);
    }

    .dt-btn-start-3d:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .dt-device-footer {
      margin-top: 14px;
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .dt-device-code {
      color: #38bdf8;
      font-family: monospace;
      background: rgba(15, 23, 42, 0.9);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
  </style>

  <div id="dautruong-auth-overlay" role="dialog" aria-modal="true" aria-labelledby="dt-modal-title">
    <div class="dt-cyber-card">
      <div class="dt-top-badge">
        <span class="dt-led-dot"></span>
        <span>ĐẤU TRƯỜNG ONLINE PRO • SẴN SÀNG THI ĐẤU</span>
      </div>

      <div class="dt-logo-wrap">
        <div class="dt-logo-3d" aria-hidden="true">🏆</div>
      </div>

      <h2 id="dt-modal-title" class="dt-neon-title">ĐẤU TRƯỜNG ONLINE PRO</h2>
      <p class="dt-subtitle">Xác thực thông tin Giáo viên để kích hoạt hệ thống điều khiển phòng thi 3D</p>

      <form id="dautruong-auth-form" autocomplete="on">
        <!-- Khối 1: Địa chỉ Gmail (Viền xanh Neon Cyan) -->
        <div class="dt-form-group dt-box-cyan">
          <label class="dt-field-label" for="dt-input-gmail">
            <span>📧</span>
            <span>Địa chỉ Gmail *</span>
          </label>
          <input
            id="dt-input-gmail"
            class="dt-input"
            type="email"
            required
            placeholder="VD: thayco.giaovien@gmail.com"
            autocomplete="email"
          />
        </div>

        <!-- Khối 2: Họ và tên Thầy / Cô (Viền tím Neon Purple) -->
        <div class="dt-form-group dt-box-purple">
          <label class="dt-field-label" for="dt-input-teacher">
            <span>👨‍🏫</span>
            <span>Họ và tên Thầy / Cô *</span>
          </label>
          <input
            id="dt-input-teacher"
            class="dt-input"
            type="text"
            required
            placeholder="Nhập đầy đủ họ và tên Thầy / Cô..."
            autocomplete="name"
          />
        </div>

        <!-- Khối 3: Trường công tác (Viền vàng Neon Gold) -->
        <div class="dt-form-group dt-box-gold">
          <label class="dt-field-label" for="dt-input-school">
            <span>🏫</span>
            <span>Trường công tác *</span>
          </label>
          <input
            id="dt-input-school"
            class="dt-input"
            type="text"
            required
            placeholder="VD: Trường THPT Mang Thít..."
            autocomplete="organization"
          />
        </div>

        <!-- Khung cảnh báo lỗi Neon Đỏ -->
        <div id="dt-auth-error" class="dt-error-alert" role="alert">
          <span style="font-size: 18px; flex-shrink: 0;">⚠️</span>
          <span id="dt-auth-error-text">Có lỗi xảy ra, vui lòng kiểm tra lại thông tin!</span>
        </div>

        <!-- Nút bấm 3D nổi khối -->
        <button id="dt-auth-submit-btn" type="submit" class="dt-btn-start-3d">
          <span>🚀</span>
          <span id="dt-auth-submit-text">VÀO ĐẤU TRƯỜNG ONLINE</span>
        </button>
      </form>

      <div class="dt-device-footer">
        <span>🛡️ Thiết bị định danh:</span>
        <span id="dt-display-device-id" class="dt-device-code">ARENA-...</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwdXDqUQbWShXFFYrgX17fCnhi0jc4TLFaoECm6DvTi8zcDO8i37dsxnLQfErZNRfj/exec";
      const USER_STORAGE_KEY = "dautruong_current_user";
      const DEVICE_STORAGE_KEY = "dautruong_device_id";

      function getOrCreateDeviceId() {
        try {
          let existingId = localStorage.getItem(DEVICE_STORAGE_KEY);
          if (!existingId || !existingId.startsWith("ARENA-")) {
            const randomPart = Math.random().toString(36).substring(2, 8).toUpperCase() +
              "-" + Date.now().toString(36).slice(-4).toUpperCase();
            existingId = "ARENA-" + randomPart;
            localStorage.setItem(DEVICE_STORAGE_KEY, existingId);
          }
          return existingId;
        } catch (err) {
          return "ARENA-" + Math.random().toString(36).substring(2, 10).toUpperCase();
        }
      }

      async function getClientIpAddress() {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(function () { controller.abort(); }, 3500);
          const response = await fetch("https://api.ipify.org?format=json", { signal: controller.signal });
          clearTimeout(timeoutId);
          if (response.ok) {
            const data = await response.json();
            if (data && data.ip) return String(data.ip);
          }
        } catch (e) {
          // Bỏ qua nếu mạng chặn ipify
        }
        return "unknown";
      }

      function showError(message) {
        const errorBox = document.getElementById("dt-auth-error");
        const errorText = document.getElementById("dt-auth-error-text");
        if (errorBox && errorText) {
          errorText.textContent = message;
          errorBox.classList.add("show");
        }
      }

      function hideError() {
        const errorBox = document.getElementById("dt-auth-error");
        if (errorBox) {
          errorBox.classList.remove("show");
        }
      }

      function initArenaAuthModal() {
        const overlay = document.getElementById("dautruong-auth-overlay");
        const form = document.getElementById("dautruong-auth-form");
        const gmailInput = document.getElementById("dt-input-gmail");
        const teacherInput = document.getElementById("dt-input-teacher");
        const schoolInput = document.getElementById("dt-input-school");
        const submitBtn = document.getElementById("dt-auth-submit-btn");
        const submitText = document.getElementById("dt-auth-submit-text");
        const deviceBadge = document.getElementById("dt-display-device-id");

        if (!overlay || !form) return;

        const deviceId = getOrCreateDeviceId();
        if (deviceBadge) {
          deviceBadge.textContent = deviceId;
        }

        // Kiểm tra nếu là thiết bị của HỌC SINH (quét mã QR hoặc mở link có ?r=, ?room=, ?role=player, hoặc #r=...)
        // thì TUYỆT ĐỐI KHÔNG hiển thị hộp thoại xác thực Giáo viên trên máy học sinh!
        const searchStr = window.location.search || "";
        const hashStr = window.location.hash || "";
        const urlParams = new URLSearchParams(searchStr);
        const hashQueryIndex = hashStr.indexOf("?");
        const hashParams = new URLSearchParams(
          hashQueryIndex !== -1 ? hashStr.substring(hashQueryIndex + 1) : hashStr.replace(/^#\/?/, "")
        );
        const isStudentUrl =
          urlParams.get("role") === "player" ||
          urlParams.has("r") ||
          urlParams.has("room") ||
          hashParams.get("role") === "player" ||
          hashParams.has("r") ||
          hashParams.has("room") ||
          /[?#&](?:r|room)=\d+/i.test(window.location.href);

        if (isStudentUrl) {
          overlay.classList.remove("active");
          overlay.style.display = "none";
          return;
        }

        try {
          const savedUser = localStorage.getItem(USER_STORAGE_KEY);
          if (savedUser) {
            const parsed = JSON.parse(savedUser);
            if (parsed && parsed.gmail && parsed.teacherName && parsed.schoolName) {
              overlay.classList.remove("active");
              return;
            }
          }
        } catch (err) {
          // Dữ liệu lỗi thì mở lại modal
        }

        // Chưa có thông tin hợp lệ (và đang ở máy Giáo viên) -> Hiển thị modal
        overlay.classList.add("active");

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          hideError();

          const gmail = (gmailInput.value || "").trim();
          const teacherName = (teacherInput.value || "").trim();
          const schoolName = (schoolInput.value || "").trim();

          if (!gmail || !teacherName || !schoolName) {
            showError("Vui lòng điền đầy đủ Gmail, Họ và tên Thầy/Cô và Trường công tác!");
            return;
          }

          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(gmail)) {
            showError("Địa chỉ Email/Gmail không hợp lệ. Vui lòng kiểm tra lại!");
            return;
          }

          submitBtn.disabled = true;
          submitText.textContent = "ĐANG XÁC THỰC HỆ THỐNG...";

          const ipAddress = await getClientIpAddress();
          const payload = {
            gmail: gmail,
            teacherName: teacherName,
            schoolName: schoolName,
            deviceId: deviceId,
            ipAddress: ipAddress,
            status: "active",
            appName: "DauTruongOnline"
          };

          try {
            const response = await fetch(GOOGLE_SCRIPT_URL, {
              method: "POST",
              headers: {
                "Content-Type": "text/plain;charset=utf-8"
              },
              body: JSON.stringify(payload)
            });

            let resultData = null;
            const rawText = await response.text();
            try {
              resultData = JSON.parse(rawText);
            } catch (_) {
              resultData = { status: rawText ? rawText.trim().toLowerCase() : "ok" };
            }

            const statusStr = String(
              (resultData && (resultData.status || resultData.result || resultData.error)) || ""
            ).toLowerCase();

            if (statusStr.includes("duplicate")) {
              showError(
                (resultData && resultData.message) ||
                "Tài khoản Gmail hoặc thiết bị này đã được đăng ký trên thiết bị khác (Duplicate)!"
              );
              submitBtn.disabled = false;
              submitText.textContent = "VÀO ĐẤU TRƯỜNG ONLINE";
              return;
            }

            if (statusStr.includes("error") || resultData?.success === false) {
              showError(
                (resultData && resultData.message) ||
                "Hệ thống từ chối xác thực hoặc có lỗi dữ liệu. Vui lòng kiểm tra lại thông tin!"
              );
              submitBtn.disabled = false;
              submitText.textContent = "VÀO ĐẤU TRƯỜNG ONLINE";
              return;
            }

            // Thành công -> Lưu localStorage và đóng modal
            localStorage.setItem(
              USER_STORAGE_KEY,
              JSON.stringify({
                gmail: gmail,
                teacherName: teacherName,
                schoolName: schoolName,
                deviceId: deviceId,
                ipAddress: ipAddress,
                status: "active",
                appName: "DauTruongOnline",
                verifiedAt: new Date().toISOString()
              })
            );

            overlay.classList.remove("active");
          } catch (networkErr) {
            showError("Không thể kết nối đến máy chủ xác thực. Vui lòng kiểm tra kết nối mạng và thử lại!");
          } finally {
            submitBtn.disabled = false;
            submitText.textContent = "VÀO ĐẤU TRƯỜNG ONLINE";
          }
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initArenaAuthModal);
      } else {
        initArenaAuthModal();
      }
    })();
  </script>
</body>
</html>
