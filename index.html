<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
<script>
// 1. Chặn các phím tắt và chuột phải ngầm định (Không hiện bảng thông báo gây phiền)
document.addEventListener('keydown', function(e) {
    if (
        e.keyCode === 123 || // F12
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || // Ctrl+Shift+I / J
        (e.ctrlKey && e.keyCode === 85) // Ctrl+U
    ) {
        e.preventDefault();
        return false;
    }
});

document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
});

// 2. Tự động kiểm tra bản quyền (Chống xóa tên tác giả Hồ Tấn Khải)
setInterval(function() {
    const bodyText = document.body.innerText;
    if (!bodyText.includes('Hồ Tấn Khải') && !bodyText.includes('Mang Thít')) {
        document.body.innerHTML = '<h1 style="color:red; text-align:center; margin-top:20vh;">CẢNH BÁO: Trang web đã bị chỉnh sửa trái phép! Vui lòng giữ nguyên thông tin bản quyền của tác giả Hồ Tấn Khải.</h1>';
    }
}, 2000);
</script>
</body>
